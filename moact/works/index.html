nt.querySelector('#zoom');let trigger,currentImage;document.querySelectorAll('.open').forEach(b=>b.addEventListener('click',()=>{trigger=b;const d=JSON.parse(b.dataset.image);currentImage=d;view.style.width='100%';view.style.maxWidth='';view.style.flexShrink='';document.querySelector('.full').style.justifyContent='center';zoom.textContent='原寸で見る';zoom.setAttribute('aria-pressed','false');picture.src=d.src;picture.alt=d.title;picture.style.cssText=d.style;view.style.aspectRatio=d.w+'/'+d.h;view.className='viewport '+(d.kind==='mobile'?'phone':'');heading.textContent=d.title;box.showModal();box.scrollTop=0}));zoom.onclick=()=>{const full=zoom.getAttribute('aria-pressed')!=='true';zoom.setAttribute('aria-pressed',String(full));zoom.textContent=full?'全体に合わせる':'原寸で見る';view.style.width=full?currentImage.w+'px':'100%';view.style.maxWidth=full?'none':'';view.style.flexShrink=full?'0':'';document.querySelector('.full').style.justifyContent=full?'flex-start':'center'};document.querySelector('#close').onclick=()=>box.close();box.addEventListener('click',e=>{if(e.target===box){const r=box.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)box.close()}});box.addEventListener('close',()=>trigger?.focus({preventScroll:true}));</script></html>
