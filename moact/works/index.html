tion id="section-2"><h2>UIコンポーネント</h2><div class="grid sheet"><article><h3>UIコンポーネント</h3><button class="open" data-image="{&quot;src&quot;: &quot;assets/moact-components-sheet.svg&quot;, &quot;title&quot;: &quot;UIコンポーネント&quot;, &quot;style&quot;: &quot;width:100.0%;left:0.0%;top:0;transform:translateY(0.0%);&quot;, &quot;w&quot;: 822.0, &quot;h&quot;: 1111.0, &quot;kind&quot;: &quot;sheet&quot;}" aria-label="UIコンポーネントを拡大"><div class="viewport"><img style="width:100.0%;left:0.0%;top:0;transform:translateY(0.0%);" src="assets/moact-components-sheet.svg" alt="UIコンポーネント" loading="lazy"></div></button></article></div></section><p class="note">画面内の仮文言・数値は制作時のサンプルです。</p></main><dialog aria-labelledby="viewer-title"><div class="toolbar"><h2 id="viewer-title"></h2><button id="zoom" aria-pressed="false">原寸で見る</button><button id="close" autofocus>閉じる</button></div><div class="full"><div class="viewport" id="full-view"><img id="full-image" alt=""></div></div></dialog><script>const box=document.querySelector('dialog'),picture=document.querySelector('#full-image'),view=document.querySelector('#full-view'),heading=document.querySelector('#viewer-title'),zoom=document.querySelector('#zoom');let trigger,currentImage;document.querySelectorAll('.open').forEach(b=>b.addEventListener('click',()=>{trigger=b;const d=JSON.parse(b.dataset.image);currentImage=d;view.style.width='100%';view.style.maxWidth='';view.style.flexShrink='';document.querySelector('.full').style.justifyContent='center';zoom.textContent='原寸で見る';zoom.setAttribute('aria-pressed','false');picture.src=d.src;picture.alt=d.title;picture.style.cssText=d.style;view.style.aspectRatio=d.w+'/'+d.h;view.className='viewport '+(d.kind==='mobile'?'phone':'');heading.textContent=d.title;box.showModal();box.scrollTop=0}));zoom.onclick=()=>{const full=zoom.getAttribute('aria-pressed')!=='true';zoom.setAttribute('aria-pressed',String(full));zoom.textContent=full?'全体に合わせる':'原寸で見る';view.style.width=full?currentImage.w+'px':'100%';view.style.maxWidth=full?'none':'';view.style.flexShrink=full?'0':'';document.querySelector('.full').style.justifyContent=full?'flex-start':'center'};document.querySelector('#close').onclick=()=>box.close();box.addEventListener('click',e=>{if(e.target===box){const r=box.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)box.close()}});box.addEventListener('close',()=>trigger?.focus({preventScroll:true}));</script></html>
