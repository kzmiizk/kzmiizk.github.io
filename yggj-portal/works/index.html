<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YGGJ Portal｜担当画面一覧</title><script data-image-loading src="../../assets/image-loading.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#263142;font:15px/1.6 system-ui}header,main{max-width:1560px;margin:auto;padding:36px 40px}header{padding-bottom:12px}.back{display:inline-block;margin-bottom:24px;color:inherit;text-decoration:none;font-size:13px}h1{font-size:36px;margin:0 0 18px}.label{font-size:13px;color:#687487;margin:0}.scope{margin:3px 0 24px}nav{display:flex;gap:12px 24px;flex-wrap:wrap}nav a{color:inherit;text-decoration:none}section{margin:0 0 54px;scroll-margin-top:24px}h2{font-size:22px;margin:0 0 24px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:32px 20px;align-items:start}.grid.sheet{grid-template-columns:1fr}.sheet .viewport{aspect-ratio:16/7}.sheet h3{display:none}.grid.desktop{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.assets{grid-template-columns:repeat(3,minmax(0,1fr))}article{min-width:0}h3{font-size:14px;font-weight:500;margin:0 0 10px}.open{display:block;width:100%;border:0;padding:0;background:transparent;cursor:zoom-in;text-align:left}.viewport{position:relative;width:100%;overflow:hidden;background:white}.mobile .viewport{aspect-ratio:375/831}.desktop .viewport{aspect-ratio:16/10}.assets .viewport{aspect-ratio:16/10}.viewport img{position:absolute;display:block;max-width:none;height:auto}.note{font-size:12px;color:#6c7787}dialog{padding:0;border:0;border-radius:12px;width:min(1100px,96vw);height:94vh;background:#edf0f4}dialog::backdrop{background:#17202bb3;backdrop-filter:blur(5px)}.toolbar{position:sticky;top:0;display:flex;align-items:center;gap:16px;padding:12px 18px;background:white;z-index:1;border-bottom:1px solid #dce1e8}.toolbar h2{margin:0;font-size:16px;flex:1}.toolbar button{padding:8px 14px;border:1px solid #d4dae2;background:white;border-radius:6px;cursor:pointer}.full{padding:24px;display:flex;justify-content:center}.full .viewport{max-width:1000px;align-self:flex-start}.full .viewport.phone{max-width:480px}@media(max-width:1000px){.grid.mobile{grid-template-columns:repeat(3,minmax(0,1fr))}header,main{padding-left:24px;padding-right:24px}}@media(max-width:600px){.grid.mobile{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 14px}.grid.desktop,.grid.assets{grid-template-columns:1fr}header,main{padding-left:16px;padding-right:16px}h1{font-size:30px}.full{padding:12px}}</style><header><a class="back" href="../index.html">← YGGJ Portalの詳細へ戻る</a><h1>YGGJ Portal</h1><p class="label">担当範囲</p><p class="scope">情報設計 ／ UIデザイン ／ ディレクション</p><nav><a href="#section-0">スマホ画面</a><a href="#section-1">PC画面</a></nav></header><main><section id="section-0"><h2>スマホ画面</h2><div class="grid mobile"><article><h3>ホーム</h3><button aria-label="ホームを拡大" class="open" data-image='{"src": "assets/source-mobile-home.png", "title": "ホーム", "style": "width:100.0%;left:0.0%;top:0;transform:translateY(0.0%);", "w": 390, "h": 3608, "kind": "mobile"}'><div class="viewport"><img alt="ホーム" decoding="async" fetchpriority="high" loading="eager" src="assets/list-thumbnails/9ae4393f266a1f79.webp" style="width:100%;left:0;top:0;transform:none;"/></div></button></article><article><h3>ギルド一覧</h3><button aria-label="ギルド一覧を拡大" class="open" data-image='{"src": "assets/source-mobile-guild.png", "title": "ギルド一覧", "style": "width:100.0%;left:0.0%;top:0;transform:translateY(0.0%);", "w": 686, "h": 4096, "kind": "mobile"}'><div class="viewport"><img alt="ギルド一覧" decoding="async" loading="eager" src="assets/list-thumbnails/a9aeb44832489138.webp" style="width:100%;left:0;top:0;transform:none;"/></div></button></article></div></section><section id="section-1"><h2>PC画面</h2><div class="grid desktop"><article><h3>ダッシュボード</h3><button aria-label="ダッシュボードを拡大" class="open" data-image='{"src": "assets/source-dashboard.png", "title": "ダッシュボード", "style": "width:100.0%;left:0.0%;top:0;transform:translateY(0.0%);", "w": 1920, "h": 1876, "kind": "desktop"}'><div class="viewport"><img alt="ダッシュボード" decoding="async" loading="eager" src="assets/list-thumbnails/1a7ee5b5dfd6e55b.webp" style="width:100%;left:0;top:0;transform:none;"/></div></button></article><article><h3>ギルド一覧</h3><button aria-label="ギルド一覧を拡大" class="open" data-image='{"src": "assets/source-guild.png", "title": "ギルド一覧", "style": "width:100.0%;left:0.0%;top:0;transform:translateY(0.0%);", "w": 3834, "h": 3332, "kind": "desktop"}'><div class="viewport"><img alt="ギルド一覧" decoding="async" loading="eager" src="assets/list-thumbnails/2f09926db0e09a90.webp" style="width:100%;left:0;top:0;transform:none;"/></div></button></article><article><h3>プロフィール</h3><button aria-label="プロフィールを拡大" class="open" data-image='{"src": "assets/source-profile.png", "title": "プロフィール", "style": "width:100.0%;left:0.0%;top:0;transform:translateY(0.0%);", "w": 3840, "h": 2064, "kind": "desktop"}'><div class="viewport"><img alt="プロフィール" decoding="async" loading="eager" src="assets/source-profile.png" srcset="assets/source-profile.png.preview.webp 1x" style="width:100.0%;left:0.0%;top:0;transform:translateY(0.0%);"/></div></button></article><article><h3>ゲーム一覧</h3><button aria-label="ゲーム一覧を拡大" class="open" data-image='{"src": "assets/source-games.png", "title": "ゲーム一覧", "style": "width:100.0%;left:0.0%;top:0;transform:translateY(0.0%);", "w": 1920, "h": 3374, "kind": "desktop"}'><div class="viewport"><img alt="ゲーム一覧" decoding="async" loading="lazy" src="assets/list-thumbnails/fa72b71637df6d41.webp" style="width:100%;left:0;top:0;transform:none;"/></div></button></article><article><h3>パートナー紹介</h3><button aria-label="パートナー紹介を拡大" class="open" data-image='{"src": "assets/source-partner.png", "title": "パートナー紹介", "style": "width:100.0%;left:0.0%;top:0;transform:translateY(0.0%);", "w": 1920, "h": 3973, "kind": "desktop"}'><div class="viewport"><img alt="パートナー紹介" decoding="async" loading="lazy" src="assets/list-thumbnails/8a5a641cf649424d.webp" style="width:100%;left:0;top:0;transform:none;"/></div></button></article></div></section><p class="note">画面内の仮文言・数値は制作時のサンプルです。</p></main><dialog aria-labelledby="viewer-title"><div class="toolbar"><h2 id="viewer-title"></h2><button id="zoom" aria-pressed="false">原寸で見る</button><button id="close" autofocus>閉じる</button></div><div class="full"><div class="viewport" id="full-view"><img id="full-image" alt=""></div></div></dialog><script>const box=document.querySelector('dialog'),picture=document.querySelector('#full-image'),view=document.querySelector('#full-view'),heading=document.querySelector('#viewer-title'),zoom=document.querySelector('#zoom');let trigger,currentImage;document.querySelectorAll('.open').forEach(b=>b.addEventListener('click',()=>{trigger=b;const d=JSON.parse(b.dataset.image);currentImage=d;view.style.width='100%';view.style.maxWidth='';view.style.flexShrink='';document.querySelector('.full').style.justifyContent='center';zoom.textContent='原寸で見る';zoom.setAttribute('aria-pressed','false');picture.src=d.src;picture.alt=d.title;picture.style.cssText=d.style;view.style.aspectRatio=d.w+'/'+d.h;view.className='viewport '+(d.kind==='mobile'?'phone':'');heading.textContent=d.title;box.showModal();box.scrollTop=0}));zoom.onclick=()=>{const full=zoom.getAttribute('aria-pressed')!=='true';zoom.setAttribute('aria-pressed',String(full));zoom.textContent=full?'全体に合わせる':'原寸で見る';view.style.width=full?currentImage.w+'px':'100%';view.style.maxWidth=full?'none':'';view.style.flexShrink=full?'0':'';document.querySelector('.full').style.justifyContent=full?'flex-start':'center'};document.querySelector('#close').onclick=()=>box.close();box.addEventListener('click',e=>{if(e.target===box){const r=box.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)box.close()}});box.addEventListener('close',()=>trigger?.focus({preventScroll:true}));</script></html>
